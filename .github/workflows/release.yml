name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            (Select-String -Path Cargo.toml -Pattern 'version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Build release
        run: cargo build --release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            "/DVERSION=${{ steps.ver.outputs.version }}" `
            installer\OringinFix.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OringinFix-windows-x64
          path: |
            target/release/OringinFix.exe
            dist/OringinFix-Setup-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/OringinFix.exe
            dist/OringinFix-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
